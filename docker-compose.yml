version: "3"

services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - 3001:3001
    networks:
      - app_network
    environment:
      - INFISICAL_TOKEN=${INFISICAL_TOKEN}

# Define a network, which allows containers to communicate
# with each other, by using their container name as a hostname
networks:
  app_network:
    external: true