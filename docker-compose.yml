version: "3"

services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      args:                                          
        SECRET_PLATFORM_TOKEN: ${SECRET_PLATFORM_TOKEN}
        SECRET_PLATFORM_ENVIRONMENT: ${SECRET_PLATFORM_ENVIRONMENT:-dev}
        HUGEICONS_LICENSE_KEY: ${HUGEICONS_LICENSE_KEY}
        GITHUB_TOKEN: ${GITHUB_TOKEN} 
    restart: always
    ports:
      - 3001:3001
    networks:
      - app_network
    image: api:latest
    environment:
      SECRET_PLATFORM_TOKEN: ${SECRET_PLATFORM_TOKEN}
      SECRET_PLATFORM_ENVIRONMENT: ${SECRET_PLATFORM_ENVIRONMENT:-dev}
    command: infisical run -- pnpm start:docker

networks:
  app_network:
    external: true