- pipeline: deploy-to-staging
  name: Deploy to Staging
  refs:
  - refs/heads/main
  fail_on_prepare_env_warning: true
  resources: NANO
  events:
  - type: PUSH
  actions:
  - action: npm test
    type: BUILD
    execute_commands:
    - "# yarn install"
    - npm install
    - npm test
    shell: BASH
    docker_image_name: library/node
    docker_image_tag: 20
