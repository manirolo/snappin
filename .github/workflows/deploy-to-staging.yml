name: Deploy to staging

on:
  pull_request:
    branches:
      - staging

jobs:
  deploy-web-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB_STAGING }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull web project settings
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Build web
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy web
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN

  deploy-admin-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN_STAGING }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull admin project settings
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Build admin
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy admin
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN